services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: masira-ctc-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  smtp:
    image: axllent/mailpit:latest
    container_name: masira-ctc-smtp
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:1025:1025"
      - "${BIND_HOST:-127.0.0.1}:${SMTP_WEB_PORT:-8025}:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: masira-ctc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Comite Tecnico Cientifico MASIRA <no-reply.ctc@udes.edu.co>}
      SMTP_TLS: ${SMTP_TLS:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4200}
      PORT: ${BACKEND_PORT:-8080}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: masira-ctc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  postgres_data:
